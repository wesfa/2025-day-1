<!doctype html>
<html lang="en" data-theme="dusk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Macros</title>
  <meta name="description" content="Food log, macros, lifting and weigh-ins.">
  <meta name="theme-color" content="#1c1410">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Macros">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/dotgothic16.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/vt323.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="scene" aria-hidden="true">
    <div class="sky"><i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i><i class="cloud c4"></i><i class="cloud c5"></i></div>
    <div class="sea"><i class="spark a"></i><i class="spark b"></i></div>
    <i class="island"></i>
    <div class="hill"></div>
    <div class="field"></div>
  </div>
  <main id="app" aria-live="polite">
    <div class="boot">Loading MACROS...</div>
  </main>
  <div id="restbar" class="restbar raised" role="timer"></div>
  <nav id="startmenu" class="startmenu raised" aria-label="Start menu"></nav>
  <nav id="taskbar" class="taskbar" aria-label="Taskbar"></nav>
  <div id="modals"></div>
  <div id="toast" class="toast" role="status"></div>
  <noscript><p style="padding:20px;color:#fff">Macros needs JavaScript turned on.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
